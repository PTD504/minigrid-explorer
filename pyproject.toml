[project]
name = "minigrid-explorer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.4.0",
    "imageio>=2.38.1",
    "imageio-ffmpeg>=0.6.0",
    "matplotlib>=3.11.2",
    "minigrid>=3.2.0",
    "networkx>=3.6.1",
    "numpy>=2.2.0",
    "pandas>=3.1.0",
    "pillow>=12.3.0",
    "pygame-gui>=0.6.14",
    "pyyaml>=6.0.3",
    "sb3-contrib>=2.9.2",
    "scipy>=1.18.1",
    "stable-baselines3>=2.9.2",
    "tdqm>=0.0.1",
    "tensorboard>=2.21.0",
    "torch==2.13.0",
    "torchvision==0.28.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:launch_testing -p no:launch_ros"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu130"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
