# PPO Hyperparameters for MiniGrid Explorer
algo: ppo

# Optimization
learning_rate: 0.0003
lr_schedule: linear   # 'constant' or 'linear'
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
clip_range_vf: null
ent_coef: 0.015       # Encourages exploration in partially observable maze
vf_coef: 0.5
max_grad_norm: 0.5

# Rollout & Batch sizes
n_steps: 128          # Steps per rollout worker before update (n_steps * n_envs = total rollout buffer)
batch_size: 64        # Mini-batch size for SGD updates
n_epochs: 4           # Number of optimization epochs per rollout

# Architecture
features_dim: 256
use_memory: true      # Ablation switch for egocentric memory crop
net_arch:
  pi: [64, 64]
  vf: [64, 64]

# Parallelization
n_envs: 8             # Number of vectorized parallel environments

# Evaluation & Checkpointing
eval_freq: 10000      # Evaluation frequency in environment steps
n_eval_episodes: 20   # Number of validation episodes per evaluation
save_freq: 25000      # Checkpoint saving frequency

