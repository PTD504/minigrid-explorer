# RecurrentPPO (PPO + LSTM) Hyperparameters for MiniGrid Explorer (Ablation Benchmark)
algo: recurrent_ppo

# Optimization
learning_rate: 0.0003
lr_schedule: linear   # 'constant' or 'linear'
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
clip_range_vf: null
ent_coef: 0.015
vf_coef: 0.5
max_grad_norm: 0.5

# Rollout & Batch sizes
n_steps: 128
batch_size: 64
n_epochs: 4

# Architecture
features_dim: 256
use_memory: False
net_arch:
  pi: [64, 64]
  vf: [64, 64]

# LSTM specific hyperparameters (MultiInputLstmPolicy)
lstm_hidden_size: 256
n_lstm_layers: 1
shared_lstm: false
enable_critic_lstm: true

# Parallelization
n_envs: 8

# Evaluation & Checkpointing
eval_freq: 10000
n_eval_episodes: 20
save_freq: 25000

